<svg width="1600" height="800" viewBox="0 0 1600 800" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Sky layer placeholder</title>
  <desc id="desc">Replace with your sky background layer.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#cfe3dc" />
      <stop offset="100%" stop-color="#f7f2e8" />
    </linearGradient>
  </defs>
  <rect width="1600" height="800" fill="url(#sky)" />
  <text x="50%" y="45%" text-anchor="middle" font-size="48" fill="#ffffff" font-family="Arial, sans-serif" opacity="0.75">
    SKY LAYER
  </text>
  <text x="50%" y="55%" text-anchor="middle" font-size="20" fill="#ffffff" font-family="Arial, sans-serif" opacity="0.7">
    Replace with your artwork
  </text>
</svg>
